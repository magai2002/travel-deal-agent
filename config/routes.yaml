  # Flexible: the agent explores Skyscanner's own "Everywhere"/flexible-date
  # search scoped to Europe instead of a fixed destination, and reports back
  # whichever city it found cheapest. destination below is a display label
  # only — flexible_destination_region drives the actual search.
  - name: "Brussels -> Europe (flexible)"
    origin: BRU
    destination: "Europe (flexible)"
    flexible_destination_region: Europe
    modes: [flight]
    category: weekend
    threshold:
      type: percent_below_avg
      value: 30
      lookback_days: 180
    hard_cap_eur: 50
