# ── Global defaults ──────────────────────────────────────────────
settings:
  home_base: BRU
  currency: EUR
  timezone: Europe/Brussels

  # Applies to any route tagged category: weekend
  weekend_trip:
    search_window_weeks: 10        # only look 10 weeks ahead — keeps request count sane
    trip_length_nights: [1, 2, 3]
    depart_weekday: [FRI, SAT]
    return_weekday: [SUN, MON]

  # Applies to any route tagged category: longhaul
  longhaul:
    search_window_weeks: 26
    flexible_dates: true
    min_trip_nights: 4
    max_trip_nights: 14

notifications:
  channel: ntfy
  ntfy_topic: alexey-travel-a7f2x
  ntfy_server: https://ntfy.sh      # swap for a self-hosted instance on alexeymagay.com later

# ── Routes — add/remove/edit freely, nothing else needs to change ──
routes:
  - name: "Brussels -> Paris"
    origin: BRU
    destination: PAR
    modes: [flixbus, flight]
    category: weekend
    threshold:
      type: percent_below_avg
      value: 30              # flag if price is >=30% below the rolling average
      lookback_days: 180
    hard_cap_eur: 35          # always flag below this, even with no history yet

  - name: "Brussels -> Amsterdam"
    origin: BRU
    destination: AMS
    modes: [flixbus]
    category: weekend
    threshold:
      type: percent_below_avg
      value: 25
      lookback_days: 180
    hard_cap_eur: 20

  - name: "Brussels -> Barcelona"
    origin: BRU
    destination: BCN
    modes: [flight]
    category: weekend
    threshold:
      type: percent_below_avg
      value: 35
      lookback_days: 180
    hard_cap_eur: 60

  - name: "Brussels -> Dubai"
    origin: BRU
    destination: DXB
    modes: [flight]
    category: longhaul
    threshold:
      type: percent_below_avg
      value: 35
