<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travel Agent Assistant</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #12131a;
    --panel: #1b1d27;
    --border: #2b2d3a;
    --text: #e6e6ea;
    --muted: #9497a8;
    --accent: #6c8cff;
    --danger: #ff6c6c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 0.9rem 1.2rem;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
  }
  header .sub { font-weight: 400; color: var(--muted); font-size: 0.85rem; }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1rem 1.2rem;
    display: flex;
    flex-direction: column;
    gap: 0.8rem;
  }
  .msg { max-width: 70ch; white-space: pre-wrap; line-height: 1.4; }
  .msg.user { align-self: flex-end; color: var(--text); background: var(--accent); padding: 0.5rem 0.8rem; border-radius: 10px 10px 2px 10px; }
  .msg.assistant { align-self: flex-start; background: var(--panel); padding: 0.5rem 0.8rem; border-radius: 10px 10px 10px 2px; }
  .msg.system { align-self: center; color: var(--muted); font-size: 0.85rem; }
  .confirm {
    align-self: flex-start;
    background: var(--panel);
    border: 1px solid var(--accent);
    border-radius: 10px;
    padding: 0.7rem 0.9rem;
    max-width: 70ch;
  }
  .confirm h4 { margin: 0 0 0.5rem; font-size: 0.85rem; color: var(--accent); }
  .confirm code { display: block; background: #0e0f15; padding: 0.4rem 0.5rem; border-radius: 6px; margin: 0.3rem 0; font-size: 0.85rem; overflow-x: auto; }
  .confirm .actions { margin-top: 0.6rem; display: flex; gap: 0.5rem; }
  button {
    font: inherit;
    border: none;
    border-radius: 6px;
    padding: 0.4rem 0.9rem;
    cursor: pointer;
  }
  .approve { background: var(--accent); color: #fff; }
  .reject { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  button:disabled { opacity: 0.5; cursor: default; }
  form {
    display: flex;
    gap: 0.6rem;
    padding: 0.8rem 1.2rem;
    border-top: 1px solid var(--border);
  }
  textarea {
    flex: 1;
    resize: none;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.6rem 0.8rem;
    font: inherit;
    height: 2.6rem;
  }
  #send { background: var(--accent); color: #fff; padding: 0 1.2rem; }
</style>
</head>
<body>
  <header>
    Travel Agent Assistant
    <div class="sub">config + price Q&amp;A — mutating changes need your approval</div>
  </header>
  <div id="log"></div>
  <form id="form">
    <textarea id="input" placeholder="Ask about prices, or add/edit a route…" autofocus></textarea>
    <button id="send" type="submit">Send</button>
  </form>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");

function addMsg(role, text) {
  const el = document.createElement("div");
  el.className = "msg " + role;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

function setBusy(busy) {
  input.disabled = busy;
  sendBtn.disabled = busy;
}

async function postTurn(body) {
  const resp = await fetch("/api/turn", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!resp.ok) {
    throw new Error(`Request failed: ${resp.status}`);
  }
  return resp.json();
}

function renderConfirm(calls) {
  const card = document.createElement("div");
  card.className = "confirm";

  const title = document.createElement("h4");
  title.textContent = "Confirmation needed";
  card.appendChild(title);

  for (const call of calls) {
    const code = document.createElement("code");
    code.textContent = `${call.tool}(${JSON.stringify(call.args)})`;
    card.appendChild(code);
  }

  const actions = document.createElement("div");
  actions.className = "actions";

  const approveBtn = document.createElement("button");
  approveBtn.className = "approve";
  approveBtn.textContent = "Approve";

  const rejectBtn = document.createElement("button");
  rejectBtn.className = "reject";
  rejectBtn.textContent = "Reject";

  actions.appendChild(approveBtn);
  actions.appendChild(rejectBtn);
  card.appendChild(actions);
  log.appendChild(card);
  log.scrollTop = log.scrollHeight;

  approveBtn.onclick = async () => {
    approveBtn.disabled = true;
    rejectBtn.disabled = true;
    setBusy(true);
    try {
      await handleResult(await postTurn({ resume: { approved: true } }));
    } catch (e) {
      addMsg("system", "Error: " + e.message);
    } finally {
      setBusy(false);
    }
  };

  rejectBtn.onclick = async () => {
    const reason = prompt("Reason (optional):") || undefined;
    approveBtn.disabled = true;
    rejectBtn.disabled = true;
    setBusy(true);
    try {
      const decision = { approved: false };
      if (reason) decision.reason = reason;
      await handleResult(await postTurn({ resume: decision }));
    } catch (e) {
      addMsg("system", "Error: " + e.message);
    } finally {
      setBusy(false);
    }
  };
}

async function handleResult(result) {
  if (result.type === "confirm") {
    renderConfirm(result.calls);
    return;
  }
  addMsg("assistant", result.text);
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  addMsg("user", text);
  input.value = "";
  setBusy(true);
  try {
    await handleResult(await postTurn({ message: text }));
  } catch (err) {
    addMsg("system", "Error: " + err.message);
  } finally {
    setBusy(false);
    input.focus();
  }
});

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});
</script>
</body>
</html>
